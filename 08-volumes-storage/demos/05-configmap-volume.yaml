apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  application.properties: |
    database.host=mysql-service
    database.port=3306
    cache.ttl=3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-volume-demo
  labels:
    app: configmap-volume-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-volume-demo
  template:
    metadata:
      labels:
        app: configmap-volume-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ['sh', '-c', 'cat /etc/config/application.properties; sleep 3600']
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
      volumes:
      - name: config-volume
        configMap:
          name: app-config
