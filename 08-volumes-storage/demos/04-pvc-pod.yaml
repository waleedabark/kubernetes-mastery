apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
  labels:
    app: pvc-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Pod started" > /data/log.txt; sleep 3600']
    volumeMounts:
    - name: pvc-volume
      mountPath: /data
  volumes:
  - name: pvc-volume
    persistentVolumeClaim:
      claimName: my-pvc
