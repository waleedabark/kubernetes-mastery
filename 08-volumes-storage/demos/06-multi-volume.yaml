apiVersion: v1
kind: Pod
metadata:
  name: multi-volume-demo
  labels:
    app: multi-volume-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Volume 1 data" > /data1/file1.txt; echo "Volume 2 data" > /data2/file2.txt; sleep 3600']
    volumeMounts:
    - name: volume-1
      mountPath: /data1
    - name: volume-2
      mountPath: /data2
  volumes:
  - name: volume-1
    emptyDir: {}
  - name: volume-2
    emptyDir: {}
