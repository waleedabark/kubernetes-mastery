apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-env
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: APP_NAME
          value: "my-nginx"
        - name: LOG_LEVEL
          value: "debug"
