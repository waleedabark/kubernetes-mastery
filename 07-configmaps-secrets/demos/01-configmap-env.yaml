apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_NAME: "my-app"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-demo
  labels:
    app: configmap-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-demo
  template:
    metadata:
      labels:
        app: configmap-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ['sh', '-c', 'env; sleep 3600']
        envFrom:
        - configMapRef:
            name: app-config
