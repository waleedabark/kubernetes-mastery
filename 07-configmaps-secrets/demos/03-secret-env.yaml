apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
data:
  username: YWRtaW4=      # base64 encoded 'admin'
  password: UEBzc3cwcmQh  # base64 encoded 'P@ssw0rd!'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-env-demo
  labels:
    app: secret-env-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-env-demo
  template:
    metadata:
      labels:
        app: secret-env-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ['sh', '-c', 'env; sleep 3600']
        envFrom:
        - secretRef:
            name: db-credentials
