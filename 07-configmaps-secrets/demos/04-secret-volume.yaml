apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-volume
type: Opaque
data:
  username: YWRtaW4=      # base64 encoded 'admin'
  password: UEBzc3cwcmQh  # base64 encoded 'P@ssw0rd!'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-volume-demo
  labels:
    app: secret-volume-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-volume-demo
  template:
    metadata:
      labels:
        app: secret-volume-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ['sh', '-c', 'cat /etc/secrets/username; cat /etc/secrets/password; sleep 3600']
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
      volumes:
      - name: secret-volume
        secret:
          secretName: db-credentials-volume
