apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  containers:
  - name: main-app
    image: nginx:1.21
    ports:
    - containerPort: 80
  initContainers:
  - name: init-myservice
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Waiting for service to be ready..."; sleep 5; echo "Init container completed!"']
